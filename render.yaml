services:
  - type: web
    name: mandi
    runtime: node
    plan: starter
    # Chrome's headless shell draws the WhatsApp banner cards (lib/banner.ts);
    # PLAYWRIGHT_BROWSERS_PATH=0 keeps it inside the project so it ships.
    buildCommand: npm ci && npx playwright install chromium --only-shell && npm run build && npx drizzle-kit push --force
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: mandi-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_DEMO_BUYER_EMAIL
        sync: false
      - key: NEXT_PUBLIC_DEMO_BUYER_PASSWORD
        sync: false
      - key: SELLER_MEERA_EMAIL
        sync: false
      - key: SELLER_ARJUN_EMAIL
        sync: false
      - key: SELLER_FATIMA_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      # WhatsApp alerts to sellers (Twilio). Links and banner images use
      # RENDER_EXTERNAL_URL, which Render sets automatically.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886

databases:
  - name: mandi-db
    plan: basic-256mb
    databaseName: mandi
